name: Full Matrix Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1

concurrency:
  group: full-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-nightly-activity:
    name: Detect Nightly Activity
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
      commit_count: ${{ steps.detect.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect recent commits
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "commit_count=manual" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit_count=$(git rev-list --count --since="30 hours ago" HEAD)
          echo "commit_count=$commit_count" >> "$GITHUB_OUTPUT"
          if [ "$commit_count" -gt 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  shards:
    name: Full / ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || needs.detect-nightly-activity.outputs.should_run == 'true'
    needs: [detect-nightly-activity]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: generators, suite: generators, workers: 8, podman: false }
          - { name: unit, suite: unit, workers: 16, podman: false }
          - { name: memory, suite: memory, workers: 8, podman: false }
          - { name: compliance-sqlite-file, suite: compliance, target: sqlite-file, role: anchor, workers: 8, podman: false }
          - { name: compliance-sqlite-memory, suite: compliance, target: sqlite-memory, role: target-specific, workers: 8, podman: false }
          - { name: compliance-mysql-8.4, suite: compliance, target: mysql-8.4, role: target-specific, workers: 8, podman: true }
          - { name: compliance-mariadb-10.11, suite: compliance, target: mariadb-10.11, role: target-specific, workers: 8, podman: true }
          - { name: compliance-mariadb-11.4, suite: compliance, target: mariadb-11.4, role: target-specific, workers: 8, podman: true }
          - { name: compliance-mariadb-11.8, suite: compliance, target: mariadb-11.8, role: target-specific, workers: 8, podman: true }
          - { name: mysql-mysql-8.4, suite: mysql, target: mysql-8.4, role: anchor, workers: 8, podman: true }
          - { name: mysql-mariadb-10.11, suite: mysql, target: mariadb-10.11, role: target-specific, workers: 8, podman: true }
          - { name: mysql-mariadb-11.4, suite: mysql, target: mariadb-11.4, role: target-specific, workers: 8, podman: true }
          - { name: mysql-mariadb-11.8, suite: mysql, target: mariadb-11.8, role: target-specific, workers: 8, podman: true }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-test-shard
        with:
          suite: ${{ matrix.suite }}
          target: ${{ matrix.target || '' }}
          affinity-role: ${{ matrix.role || '' }}
          workers: ${{ matrix.workers }}
          install-podman: ${{ matrix.podman }}
          evidence-name: full-shard-${{ matrix.name }}

  aggregate:
    name: Full evidence aggregate
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-nightly-activity.outputs.should_run == 'true')
    needs: [detect-nightly-activity, shards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download every shard
        uses: actions/download-artifact@v4
        with:
          pattern: full-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/downloaded-shards
          merge-multiple: false
      - name: Build aggregator
        run: dotnet build src/DataLinq.Testing.CLI/DataLinq.Testing.CLI.csproj --configuration Release --nologo --verbosity minimal -p:NuGetAudit=false
      - name: Validate full evidence
        run: >
          dotnet exec src/DataLinq.Testing.CLI/bin/Release/net10.0/DataLinq.Testing.CLI.dll
          aggregate
          --input-root artifacts/downloaded-shards
          --output artifacts/ci/full-matrix-aggregate.json
          --commit-sha ${{ github.sha }}
          --configuration Release
      - name: Create test-count badge data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          aggregate = json.loads(Path("artifacts/ci/full-matrix-aggregate.json").read_text(encoding="utf-8"))
          if aggregate.get("Complete") is not True:
              raise SystemExit("full-matrix aggregate is incomplete")
          badge = {"schemaVersion": 1, "label": "full matrix tests", "message": str(aggregate["TotalCases"]), "color": "brightgreen"}
          Path("artifacts/ci/full-matrix-tests.json").write_text(json.dumps(badge, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-matrix-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/full-matrix-aggregate.json
            artifacts/ci/full-matrix-tests.json
          if-no-files-found: warn

  publish-badge:
    name: Publish full-matrix badge
    if: github.ref == 'refs/heads/master'
    needs: [aggregate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: full-matrix-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: aggregate-artifact
      - name: Publish badge data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badge-data || true
          if git show-ref --verify --quiet refs/remotes/origin/badge-data; then
            git worktree add badge-data-worktree refs/remotes/origin/badge-data
          else
            git worktree add --detach badge-data-worktree
            pushd badge-data-worktree
            git switch --orphan badge-data
            git rm -rf . > /dev/null 2>&1 || true
            popd
          fi
          mkdir -p badge-data-worktree/.github/badges
          cp aggregate-artifact/full-matrix-tests.json badge-data-worktree/.github/badges/full-matrix-tests.json
          pushd badge-data-worktree
          git add .github/badges/full-matrix-tests.json
          if git diff --cached --quiet; then
            echo "No badge changes to push."
            exit 0
          fi
          git commit -m "Update full matrix test count badge [skip ci]"
          git push origin HEAD:badge-data
