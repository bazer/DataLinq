name: Latest CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1

concurrency:
  group: latest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    uses: ./.github/workflows/dependency-audit.yml

  smoke:
    name: Smoke (no Podman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-test-shard
        with:
          plan: smoke
          workers: 8
          evidence-name: smoke

  local:
    name: Local / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: generators, suite: generators, workers: 8 }
          - { name: unit, suite: unit, workers: 16 }
          - { name: memory, suite: memory, workers: 8 }
          - { name: sqlite-file, suite: compliance, target: sqlite-file, role: anchor, workers: 8 }
          - { name: sqlite-memory, suite: compliance, target: sqlite-memory, role: target-specific, workers: 8 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-test-shard
        with:
          suite: ${{ matrix.suite }}
          target: ${{ matrix.target || '' }}
          affinity-role: ${{ matrix.role || '' }}
          workers: ${{ matrix.workers }}
          evidence-name: local-${{ matrix.name }}

  latest-servers:
    name: Server / ${{ matrix.suite }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: compliance, target: mysql-9.7, role: target-specific }
          - { suite: compliance, target: mariadb-12.3, role: target-specific }
          - { suite: mysql, target: mysql-9.7, role: anchor }
          - { suite: mysql, target: mariadb-12.3, role: target-specific }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-test-shard
        with:
          suite: ${{ matrix.suite }}
          target: ${{ matrix.target }}
          affinity-role: ${{ matrix.role }}
          workers: 8
          install-podman: true
          evidence-name: latest-${{ matrix.suite }}-${{ matrix.target }}

  required:
    name: Latest required gate
    if: always()
    needs: [smoke, local, latest-servers, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          LOCAL_RESULT: ${{ needs.local.result }}
          SERVER_RESULT: ${{ needs.latest-servers.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          test "$SMOKE_RESULT" = success
          test "$LOCAL_RESULT" = success
          test "$SERVER_RESULT" = success
          test "$AUDIT_RESULT" = success
