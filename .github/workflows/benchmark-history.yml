name: Benchmark History

on:
  push:
    branches: ["master", "v[0-9]*"]
  workflow_dispatch:
    inputs:
      profile:
        description: Published benchmark profile
        type: choice
        options: [default, heavy]
        default: default
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: benchmark-history
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BENCHMARK_PROFILE: ${{ github.event_name == 'schedule' && 'heavy' || inputs.profile || 'default' }}
  BENCHMARK_FILTER: "*EmployeesBenchmarks*"

jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.channel.outputs.publish }}
      channels: ${{ steps.channel.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - id: channel
        run: python scripts/benchmark_channels.py resolve

  benchmark-history:
    name: Benchmark History
    needs: channel
    if: needs.channel.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      DATALINQ_BENCHMARK_PROVIDERS: sqlite-memory
      RELEASE_CHANNELS: ${{ needs.channel.outputs.channels }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore benchmark CLI
        run: dotnet restore src/DataLinq.Benchmark.CLI/DataLinq.Benchmark.CLI.csproj -p:NuGetAudit=false

      - name: Build benchmark CLI
        run: dotnet build src/DataLinq.Benchmark.CLI/DataLinq.Benchmark.CLI.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Prepare benchmark data worktree
        shell: bash
        run: |
          git fetch origin benchmark-data || true

          if git show-ref --verify --quiet refs/remotes/origin/benchmark-data; then
            git worktree add benchmark-data-worktree refs/remotes/origin/benchmark-data
          else
            git worktree add --detach benchmark-data-worktree
            pushd benchmark-data-worktree
            git switch --orphan benchmark-data
            git rm -rf . > /dev/null 2>&1 || true
            popd
          fi

      - name: Run published benchmark subset
        shell: bash
        run: |
          mkdir -p artifacts/benchmarks/ci
          rm -f \
            artifacts/benchmarks/ci/baseline-same-profile.json \
            artifacts/benchmarks/ci/latest-history.json \
            artifacts/benchmarks/ci/latest-comparison.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = os.environ.get("BENCHMARK_PROFILE", "default")
          benchmark_filter = os.environ["BENCHMARK_FILTER"]
          history_path = Path("benchmark-data-worktree/benchmarks/history.json")
          baseline_path = Path("artifacts/benchmarks/ci/baseline-same-profile.json")

          if history_path.exists():
              history = json.loads(history_path.read_text(encoding="utf-8"))
              runs = history.get("Runs", [])
              if not isinstance(runs, list):
                  raise SystemExit("Published benchmark history has an invalid Runs collection.")

              candidates = []
              for run in runs:
                  if not isinstance(run, dict):
                      continue
                  metadata = run.get("Metadata")
                  if not isinstance(metadata, dict):
                      continue
                  if metadata.get("Branch") != os.environ["GITHUB_REF_NAME"]:
                      continue
                  if metadata.get("Profile") != profile:
                      continue
                  if metadata.get("Filter") != benchmark_filter:
                      continue
                  runtime = metadata.get("RuntimeDescription")
                  if not isinstance(runtime, str) or not runtime.startswith(".NET 10."):
                      continue
                  schema_version = run.get("SchemaVersion")
                  if type(schema_version) is not int or schema_version not in (1, 2):
                      continue
                  candidates.append(run)

              if candidates:
                  baseline_path.write_text(json.dumps(candidates[-1], indent=2) + "\n", encoding="utf-8")
          PY

          baseline_args=()
          if [ -f artifacts/benchmarks/ci/baseline-same-profile.json ]; then
            baseline_args+=(--baseline artifacts/benchmarks/ci/baseline-same-profile.json)
            baseline_args+=(--comparison-json artifacts/benchmarks/ci/latest-comparison.json)
          fi

          dotnet exec src/DataLinq.Benchmark.CLI/bin/Release/net10.0/DataLinq.Benchmark.CLI.dll run \
            --profile "${BENCHMARK_PROFILE}" \
            --filter "${BENCHMARK_FILTER}" \
            --history-json artifacts/benchmarks/ci/latest-history.json \
            "${baseline_args[@]}" \
            -- --anyCategories stable macro-readwrite macro-bulk

      - name: Update published benchmark history
        if: success()
        shell: bash
        run: |
          git fetch origin benchmark-data || true
          if git show-ref --verify --quiet refs/remotes/origin/benchmark-data; then
            pushd benchmark-data-worktree
            git reset --hard refs/remotes/origin/benchmark-data
            popd
          fi

          python scripts/publish_benchmark_history.py

      - name: Publish benchmark history branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pushd benchmark-data-worktree
          git add benchmarks
          if git diff --cached --quiet; then
            echo "No benchmark history changes to push."
            popd
            exit 0
          fi

          git commit -m "Update benchmark history [skip ci]"
          git push origin HEAD:benchmark-data
          popd

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history-${{ github.ref_name }}-${{ github.run_id }}
          path: artifacts/benchmarks
          if-no-files-found: ignore
